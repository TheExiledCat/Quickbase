[package]
name = "qbase"
version = "0.1.0"
edition = "2024"

[lib]
name = "libqbase"
[dependencies]
chrono = {version="0.4.40",features=["serde"]}
hex = "0.4.3"
inquire = "0.7.5"
libsqlite3-sys = "0.34.0"
rusqlite = {version="0.36.0" ,features = ["bundled"]}
semver = "1.0.26"
serde = {version= "1.0.219", features = ["derive"]}
serde-semver = "0.2.1"
serde_json = "1.0.140"
sha2 = "0.10.9"
uuid = {version="1.16.0",features=["v4"]}
ts-rs = {version ="10.1",features =["chrono-impl", "semver-impl"]}
