[package]
name = "qbase_runtime"
version = "0.1.0"
edition = "2024"
[[bin]]
name="quickbase"
path="./src/main.rs"
[dependencies]
axum = "0.8.4"
axum-folder-router = "0.3"
chrono = "0.4.41"
hyper = "1.6.0"
jsonwebtoken = "9.3.1"
qbase = {path="../lib"}
serde = "1.0.219"
serde_json = "1.0.140"
tokio = { version = "1.45.0", features = ["full"] }
tower = "0.5.2"
tower-http = "0.6.4"
